name: Companion Android beta and Play 16 KB check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build tests, release AAB and APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest bundleRelease assembleRelease assembleDebug
      - name: Verify Google Play 16 KB compatibility
        run: |
          set -euo pipefail
          BUNDLE="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          curl --retry 3 -fLsS \
            "https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar" \
            -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar dump config --bundle="$BUNDLE" > /tmp/bundle-config.txt
          python3 tools/check_16kb_elf.py "$BUNDLE"
          if unzip -Z1 "$BUNDLE" | grep -Eq '/lib/(arm64-v8a|x86_64)/.*\\.so$'; then
            grep -q 'PAGE_ALIGNMENT_16K' /tmp/bundle-config.txt || {
              echo "App Bundle does not request 16 KB native library zip alignment"
              cat /tmp/bundle-config.txt
              exit 1
            }
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -v -c -P 16 4 "$APK"
      - name: Upload unsigned release bundle and test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qzcompanionocr-beta-build
          if-no-files-found: warn
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
